name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python tests and routing benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run routing performance benchmark
        run: python scripts/benchmark_routes.py --iterations 100 --output route-benchmark.json
      - name: Upload routing benchmark
        uses: actions/upload-artifact@v4
        with:
          name: route-benchmark
          path: route-benchmark.json
